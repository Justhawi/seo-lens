# Render blueprint. With this file in the repo, Render configures the service
# itself — you don't have to fill anything in on the dashboard.
services:
  - type: web
    name: seo-lens
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
